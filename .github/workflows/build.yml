name: Build and Test

on:
  pull_request:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run prod

      # jestbench drives a real, headless Blockbench (via xvfb-run) and downloads
      # it plus the target Minecraft client jar on the first run. Both live under
      # ~/.envbench, so caching that folder keeps later runs offline-fast.
      - name: Cache Blockbench test environment
        uses: actions/cache@v4
        with:
          path: ~/.envbench
          key: envbench-${{ runner.os }}-animated-java-tests

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        run: bun run test:only

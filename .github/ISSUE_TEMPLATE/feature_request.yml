name: ✨ Feature Request
description: Suggest a new feature or enhancement for Animated Java!
title: ✨ [FEATURE TITLE]
labels:
  - ✨ Enhancement
assignees:
  - SnaveSutit
body:
  - type: markdown
    attributes:
      value: >-
        # 👋 Thanks for the Suggestion!

        Fill out what you can below — clear, specific requests are much more
        likely to get picked up and implemented.

  - type: checkboxes
    id: confirmations
    attributes:
      label: 🛑 Quick Checklist
      description: >-
        A few quick checks before you post — these help us avoid duplicate
        requests and wasted back-and-forth.
      options:
        - label: >-
            I searched [existing feature
            requests](https://github.com/Animated-Java/animated-java/labels/%E2%9C%A8%20Enhancement)
            and didn't find mine.
          required: true
        - label: >-
            I checked [the documentation](https://animated-java.dev/docs/)
            and this isn't already possible.
          required: true
        - label: >-
            I'm using the [latest
            version](https://builds.animated-java.dev/latest) of Animated Java.
          required: true
        - label: >-
            This request is about a single feature. (If I have more than one
            idea, I'll file a separate request for each.)
          required: true

  - type: markdown
    attributes:
      value: '---'

  - type: textarea
    id: description
    attributes:
      label: 📝 What's the problem, or what's missing?
      description: >-
        Describe what you're trying to do, and where Animated Java gets in
        the way or falls short.
      placeholder: My lawnmower doesn't work on mars.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 What would you like to see?
      description: If you already have an idea for how this could work, describe it here.
      placeholder: >-
        Combustion engines don't work without enough oxygen, so maybe we could
        use an electric engine instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🧪 Tried anything else?
      description: >-
        Any workarounds or alternative approaches you've already tried, and
        why they didn't quite do the job.

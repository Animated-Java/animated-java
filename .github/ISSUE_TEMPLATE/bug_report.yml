name: 🐛 Bug Report
description: Report a problem or bug you encountered while using Animated Java
title: 🐛 [BUG TITLE]
labels:
  - 🐛 Bug
assignees:
  - SnaveSutit
body:
  - type: markdown
    attributes:
      value: >-
        # 👋 Thanks for Reporting a Bug!

        Every bug report that gets fixed makes Animated Java better for
        everyone. Fill out what you can below — the more detail you give us,
        the faster we can track down the problem.

  - type: checkboxes
    id: confirmations
    attributes:
      label: 🛑 Quick Checklist
      description: >-
        A few quick checks before you post — these help us avoid duplicate
        reports and wasted back-and-forth.
      options:
        - label: >-
            I searched [existing bug
            reports](https://github.com/Animated-Java/animated-java/labels/%F0%9F%90%9B%20Bug)
            and didn't find mine.
          required: true
        - label: >-
            I checked the [F-A-Q](https://animated-java.dev/docs/resources/faq)
            and my issue isn't answered there.
          required: true
        - label: >-
            I'm using the [latest
            version](https://builds.animated-java.dev/latest) of Animated Java.
          required: true
        - label: >-
            This report is about a single bug. (If I found more than one,
            I'll file a separate report for each.)
          required: true

  - type: markdown
    attributes:
      value: '---'

  - type: textarea
    id: description
    attributes:
      label: 🗣️ What happened?
      description: >-
        Describe the bug in your own words. Screenshots, videos, and
        `.ajblueprint` files are all welcome, and often help us understand
        the problem a lot faster.
      placeholder: My lawnmower is producing large clumps of grass.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 🔄️ Steps to reproduce
      description: >-
        Walk us through exactly what you did, step by step, right before the
        bug showed up.
      placeholder: |-
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ What did you expect to happen instead?
      placeholder: >-
        My lawnmower should produce small grass clippings that easily filter
        into the lawn.
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: ⚠️ Error message
      description: >-
        If Animated Java or Blockbench showed you an error message, paste it
        here. If not, leave this blank.
      render: javascript

  - type: textarea
    id: solutions
    attributes:
      label: 💡 Found a workaround?
      description: >-
        If you've found a way around the problem — even a clunky one — let us
        know. It helps other users in the meantime, and sometimes points us
        straight at the fix.
      placeholder: >-
        I could use a lawnmower bag, but I'd need to buy one, and empty it
        periodically while mowing.

  - type: markdown
    attributes:
      value: |-
        # ⛰️ Your Setup

        This helps us tell whether the bug is specific to a certain version,
        platform, or mod/plugin combo. If you're not sure about something,
        your best guess is fine.

  - type: input
    id: mc-version
    attributes:
      label: 🟩 Minecraft Version
      description: >-
        Shown in the bottom-right corner of the Minecraft title screen.
      placeholder: E.g. 1.20.4, 26.2
    validations:
      required: true

  - type: input
    id: bb-version
    attributes:
      label: 🟦 Blockbench Version
      description: Found under Blockbench's Help menu → About Blockbench.
      placeholder: E.g. 4.12.2
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 💻 Operating System
      description: The operating system of the computer you're using Animated Java on.
      options:
        - Windows
        - Linux
        - MacOS
    validations:
      required: true

  - type: textarea
    id: installed-bb-plugins
    attributes:
      label: 📃 Other Blockbench Plugins
      description: >-
        Any other Blockbench plugins you have installed besides Animated
        Java. If it's just Animated Java, leave this blank.
      placeholder: |-
        - Geckolib Animation Utils
        - Cameras
        - Double Sided Cubes
        - etc...

  - type: textarea
    id: environment
    attributes:
      label: 🎮 Modded Client or Server?
      description: >-
        If you're just playing vanilla Minecraft (singleplayer or a plain
        server), you can leave this blank. If you're using mods, a modpack,
        or server plugins, tell us about them here.
      placeholder: |
        ## Server environment

        I'm using a Paper server
        - Paper build #174 for MC 1.20.1

        I have the following plugins installed:
        - Essentials
        - Slimefun
        - etc...

        ## Client Environment

        I'm using a Fabric modded client.
        - Fabric loader 0.16.10 for Minecraft 1.20.1

        I have the following mods installed:
        - Sodium 1.0.0
        - Starlight 1.0.0
        - Create 1.0.0
